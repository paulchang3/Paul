<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_blank">
<meta charset="UTF-8">
<style>
  :root{
    --ink:#14213D; --ink-soft:#2C4A6E; --paper:#F5F6F8; --card:#FFFFFF;
    --line:#D9DEE6; --muted:#5B6472; --teal:#0E7C7B; --teal-dark:#0A5D5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
    line-height:1.75;
  }
  .hero{
    background:var(--ink); color:#fff; padding:44px 6vw 40px;
    border-bottom:4px solid var(--teal);
  }
  .hero .eyebrow{
    font-family:monospace; font-size:12px; letter-spacing:.14em;
    color:var(--teal); text-transform:uppercase; margin-bottom:8px;
  }
  .hero h1{font-size:clamp(22px,4vw,34px); margin:0 0 10px; line-height:1.4;}
  .hero p{color:#C7D3E0; max-width:640px; margin:0; font-size:15px;}
  main{max-width:820px; margin:0 auto; padding:36px 5vw 80px;}
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:18px 22px; margin-bottom:14px;
  }
  .item .meta{
    font-family:monospace; font-size:11.5px; color:var(--teal-dark);
    letter-spacing:.04em; margin-bottom:6px;
  }
  .item h2{font-size:17px; margin:0 0 6px; line-height:1.5;}
  .item h2 a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--teal);}
  .item h2 a:hover{color:var(--teal-dark);}
  .item p{margin:0; color:var(--muted); font-size:14px;}
  .empty{
    text-align:center; color:var(--muted); padding:50px 0; font-size:14.5px;
  }
  .subscribe{
    margin-top:36px; background:#F1F6F5; border:1px solid #BFE3DB;
    border-left:4px solid var(--teal); border-radius:6px; padding:20px 24px;
  }
  .subscribe h3{margin:0 0 6px; font-size:15.5px; color:var(--teal-dark);}
  .subscribe p{margin:0 0 12px; font-size:13.5px; color:var(--muted);}
  .subscribe a{
    display:inline-block; background:var(--teal); color:#fff; text-decoration:none;
    padding:9px 18px; border-radius:5px; font-size:13.5px; font-weight:700;
  }
  .subscribe a:hover{background:var(--teal-dark);}
  footer{
    text-align:center; color:#8A93A0; font-size:12px; padding:0 5vw 40px;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Regulatory Insights</div>
  <h1><?= data.title ?></h1>
  <p><?= data.tagline ?></p>
</div>

<main>
  <? if (data.items.length === 0) { ?>
    <div class="empty">內容整理中，歡迎先訂閱季報。</div>
  <? } else { ?>
    <? data.items.forEach(function(it) { ?>
      <div class="item">
        <div class="meta"><?= it.date ?><? if (it.pillar) { ?> · <?= it.pillar ?><? } ?><? if (it.channel) { ?> · <?= it.channel ?><? } ?></div>
        <h2>
          <? if (it.link) { ?>
            <a href="<?= it.link ?>"><?= it.title ?></a>
          <? } else { ?>
            <?= it.title ?>
          <? } ?>
        </h2>
        <? if (it.summary) { ?><p><?= it.summary ?></p><? } ?>
      </div>
    <? }); ?>
  <? } ?>

  <? if (data.contact) { ?>
  <div class="subscribe">
    <h3>📮 訂閱「法規動態季報」</h3>
    <p>每季一期：FDA / EU MDR / TFDA / NMPA / PMDA 五大市場動態與跨市場解讀，直接寄到您的信箱。</p>
    <a href="mailto:<?= data.contact ?>?subject=訂閱法規動態季報&body=您好，我想訂閱法規動態季報。%0A姓名：%0A公司／職稱：">來信訂閱</a>
  </div>
  <? } ?>
</main>

<footer>© <?= new Date().getFullYear() ?> <?= data.title ?> · 本頁內容為個人專業觀察，不構成法規申報建議</footer>

</body>
</html>
