<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mobile Controller</title>
<style>
  :root {
    --bg:        #0D1117;
    --panel:     #161B22;
    --border:    #30363D;
    --accent:    #58A6FF;
    --green:     #3FB950;
    --red:       #F85149;
    --text:      #E6EDF3;
    --dim:       #8B949E;
    --radius:    12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
  }

  /* ── 頂部狀態列 ── */
  #statusBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #statusBar .led {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    transition: background .3s;
  }
  #statusBar .led.on { background: var(--green); }
  #deviceName {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
  }
  #colorDot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--border);
  }

  /* ── 主體 ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 12px 16px;
    gap: 10px;
    overflow-y: auto;
  }

  /* ── 搖桿容器 ── */
  #joystickZone {
    display: none; /* 搖桿模式才顯示 */
    width: 200px; height: 200px;
    background: var(--panel);
    border-radius: 50%;
    border: 2px solid var(--border);
    position: relative;
    touch-action: none;
  }
  #joystickKnob {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: background .1s;
    cursor: grab;
  }

  /* ── 方向鍵 ── */
  #dpadZone {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(3, 72px);
    gap: 6px;
  }

  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background .1s, transform .05s;
    -webkit-user-select: none;
  }
  .btn:active, .btn.pressed {
    background: var(--accent);
    color: #000;
    transform: scale(0.94);
  }

  /* d-pad 格局 */
  .dpad-nw { grid-area: 1/1; }
  .dpad-n  { grid-area: 1/2; }
  .dpad-ne { grid-area: 1/3; }
  .dpad-w  { grid-area: 2/1; }
  .dpad-c  { grid-area: 2/2; background: #1c2330; } /* 中央重置 */
  .dpad-e  { grid-area: 2/3; }
  .dpad-sw { grid-area: 3/1; }
  .dpad-s  { grid-area: 3/2; }
  .dpad-se { grid-area: 3/3; }

  /* ── 速度滑桿 ── */
  #speedRow {
    width: 100%;
    max-width: 320px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #speedRow label { color: var(--dim); font-size: 13px; white-space: nowrap; }
  #speedSlider {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  #speedVal { color: var(--accent); font-size: 13px; font-weight: bold; width: 30px; text-align: right; }

  /* ── 顏色選擇 ── */
  #colorRow {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .1s, border-color .1s;
  }
  .color-swatch.active { border-color: #fff; transform: scale(1.2); }

  /* ── 模式切換 ── */
  #modeRow {
    display: flex;
    gap: 8px;
  }
  .mode-btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: bold;
  }

  /* ── 拖曳畫布 ── */
  #dragCanvas {
    display: none;
    width: 100%;
    max-width: 340px;
    height: 200px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    touch-action: none;
    position: relative;
    overflow: hidden;
  }
  #dragDot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 8px rgba(255,255,255,.5);
  }

  /* ── 滑鼠觸控板（第一台手機）── */
  #touchpad {
    display: none;
    width: 100%;
    max-width: 340px;
    height: 230px;
    background: var(--panel);
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
    touch-action: none;
    position: relative;
    overflow: hidden;
    user-select: none;
  }
  #touchpad .hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--dim); font-size: 13px; line-height: 1.7;
    pointer-events: none; padding: 12px;
  }

  /* ── 角色橫幅（你是滑鼠）── */
  #roleBanner {
    display: none;
    width: 100%; max-width: 340px;
    background: rgba(63,185,80,.15);
    border: 1px solid var(--green);
    color: var(--green);
    border-radius: var(--radius);
    padding: 8px 12px; font-size: 13px; text-align: center; font-weight: 600;
  }
  #roleBanner.show { display: block; }

  /* ── 上傳照片 ── */
  #photoRow {
    display: flex; align-items: center; gap: 10px;
    width: 100%; max-width: 340px; justify-content: center;
  }
  #photoBtn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 10px; font-size: 14px; cursor: pointer;
  }
  #photoBtn:active { background: var(--accent); color: #000; }
  #photoPreview {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--border);
    background-size: cover; background-position: center;
    display: none;
  }
  #photoPreview.show { display: block; }

  /* ── 連線中 overlay ── */
  #connectingOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    gap: 16px;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 連線中遮罩 -->
<div id="connectingOverlay">
  <div class="spinner"></div>
  <div style="color:var(--dim);font-size:14px;">正在連線伺服器…</div>
</div>

<!-- 頂部狀態列 -->
<div id="statusBar">
  <div class="led" id="wsLed"></div>
  <div id="deviceName">連線中…</div>
  <div id="colorDot"></div>
</div>

<!-- 主體 -->
<div id="main">

  <!-- 角色橫幅：你是第一台（滑鼠） -->
  <div id="roleBanner">🖱️ 你是第一台手機 ＝ 滑鼠</div>

  <!-- 模式切換 -->
  <div id="modeRow">
    <div class="mode-btn active" data-mode="dpad"    onclick="setMode('dpad')">方向鍵</div>
    <div class="mode-btn"        data-mode="joystick" onclick="setMode('joystick')">搖桿</div>
    <div class="mode-btn"        data-mode="drag"     onclick="setMode('drag')">拖曳</div>
    <div class="mode-btn"        data-mode="mouse"    onclick="setMode('mouse')">滑鼠</div>
  </div>

  <!-- 方向鍵 -->
  <div id="dpadZone">
    <div class="btn dpad-nw" data-dx="-1" data-dy="-1">↖</div>
    <div class="btn dpad-n"  data-dx="0"  data-dy="-1">↑</div>
    <div class="btn dpad-ne" data-dx="1"  data-dy="-1">↗</div>
    <div class="btn dpad-w"  data-dx="-1" data-dy="0">←</div>
    <div class="btn dpad-c"  id="resetBtn">⊙</div>
    <div class="btn dpad-e"  data-dx="1"  data-dy="0">→</div>
    <div class="btn dpad-sw" data-dx="-1" data-dy="1">↙</div>
    <div class="btn dpad-s"  data-dx="0"  data-dy="1">↓</div>
    <div class="btn dpad-se" data-dx="1"  data-dy="1">↘</div>
  </div>

  <!-- 搖桿 -->
  <div id="joystickZone">
    <div id="joystickKnob"></div>
  </div>

  <!-- 拖曳畫布 -->
  <div id="dragCanvas">
    <div id="dragDot"></div>
  </div>

  <!-- 滑鼠觸控板（第一台手機操控真實滑鼠）-->
  <div id="touchpad">
    <div class="hint">滑鼠觸控板<br>滑動＝移動游標　單擊＝選擇<br>雙擊＝啟動　雙指上下＝滾輪</div>
  </div>

  <!-- 上傳照片（顯示在圓圈裡）-->
  <div id="photoRow">
    <button id="photoBtn" type="button">上傳照片（圓圈圖案）</button>
    <div id="photoPreview"></div>
    <input id="photoInput" type="file" accept="image/*" style="display:none">
  </div>

  <!-- 速度 -->
  <div id="speedRow">
    <label>速度</label>
    <input type="range" id="speedSlider" min="1" max="10" value="5">
    <span id="speedVal">5</span>
  </div>

  <!-- 顏色 -->
  <div id="colorRow">
    <span style="color:var(--dim);font-size:13px;">顏色：</span>
  </div>

</div><!-- /main -->

<script>
// ════════════════════════════════════════════════════════
//  Controller — WebSocket Client
// ════════════════════════════════════════════════════════

const COLORS = [
  "#FF4757","#2ED573","#1E90FF","#FFA502",
  "#A29BFE","#00CEC9","#FD79A8","#FDCB6E",
  "#6C5CE7","#55EFC4"
];

let ws        = null;
let deviceId  = null;
let token     = null;
let speed     = 5;
let mode      = "dpad";
let canvasW   = 1000;
let canvasH   = 700;
let posX      = 500;
let posY      = 350;
let myColor   = "#58A6FF";
let sendTimer = null;
let pressedBtns = {};  // dx,dy → intervalId
let isFirst   = false; // 是否為第一台手機（= 滑鼠）
let autoPickedMouse = false; // 是否已自動切到滑鼠模式（只做一次）

// ── WebSocket 連線 ────────────────────────────────────────

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url   = `${proto}//${location.host}/ws/mobile`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    document.getElementById("wsLed").classList.add("on");
  };

  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "init")   handleInit(msg);
      if (msg.type === "ping")   ws.send(JSON.stringify({type:"pong"}));
      if (msg.type === "role")   updateRole(msg.first_device_id);
    } catch(e) {}
  };

  ws.onclose = () => {
    document.getElementById("wsLed").classList.remove("on");
    document.getElementById("deviceName").textContent = "已斷線，重新連線中…";
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

function handleInit(msg) {
  deviceId = msg.device_id;
  token    = msg.token;
  myColor  = msg.color;
  canvasW  = msg.canvas_w || 1000;
  canvasH  = msg.canvas_h || 700;
  posX     = msg.x || canvasW / 2;
  posY     = msg.y || canvasH / 2;

  document.getElementById("deviceName").textContent = msg.display_name || "手機";
  document.getElementById("colorDot").style.background = myColor;
  document.getElementById("connectingOverlay").style.display = "none";

  // 更新拖曳點顏色
  document.getElementById("dragDot").style.background = myColor;

  // 選中對應顏色格
  updateColorSwatches();

  // 角色（是否第一台 = 滑鼠）
  isFirst = !!msg.is_first;
  applyRole();
}

// ── 角色：第一台手機 = 滑鼠 ───────────────────────────────────────────────

function updateRole(firstDeviceId) {
  isFirst = (firstDeviceId && firstDeviceId === deviceId);
  applyRole();
}

function applyRole() {
  const banner = document.getElementById("roleBanner");
  banner.classList.toggle("show", isFirst);
  // 第一台手機第一次得到角色時，自動切到「滑鼠」模式（只做一次，之後尊重使用者選擇）
  if (isFirst && !autoPickedMouse) {
    autoPickedMouse = true;
    setMode("mouse");
  }
}

// ── 滑鼠動作訊息 ──────────────────────────────────────────────────────────

function sendClick() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !deviceId) return;
  ws.send(JSON.stringify({ type:"click", device_id:deviceId, token }));
}
function sendDblClick() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !deviceId) return;
  ws.send(JSON.stringify({ type:"dblclick", device_id:deviceId, token }));
}
function sendScroll(amount) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !deviceId) return;
  ws.send(JSON.stringify({ type:"scroll", device_id:deviceId, token, amount }));
}

// ── 傳送控制訊息 ──────────────────────────────────────────

function sendMove(dx, dy) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !deviceId) return;
  ws.send(JSON.stringify({
    type: "move",
    device_id: deviceId,
    token,
    dx, dy,
    speed: speed / 5.0,
  }));
}

function sendPosition(x, y) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !deviceId) return;
  ws.send(JSON.stringify({
    type: "set_position",
    device_id: deviceId,
    token, x, y,
  }));
}

function sendReset() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !deviceId) return;
  ws.send(JSON.stringify({
    type: "reset",
    device_id: deviceId,
    token,
  }));
  posX = canvasW / 2;
  posY = canvasH / 2;
  updateDragDot();
}

// ── 方向鍵 ────────────────────────────────────────────────

const REPEAT_INTERVAL = 16; // ~60fps

function dpadStart(btn) {
  const dx = parseFloat(btn.dataset.dx);
  const dy = parseFloat(btn.dataset.dy);
  const key = `${dx},${dy}`;
  if (pressedBtns[key]) return;
  btn.classList.add("pressed");
  sendMove(dx, dy);
  pressedBtns[key] = setInterval(() => sendMove(dx, dy), REPEAT_INTERVAL);
}

function dpadEnd(btn) {
  const dx = parseFloat(btn.dataset.dx);
  const dy = parseFloat(btn.dataset.dy);
  const key = `${dx},${dy}`;
  clearInterval(pressedBtns[key]);
  delete pressedBtns[key];
  btn.classList.remove("pressed");
}

document.querySelectorAll(".btn[data-dx]").forEach(btn => {
  btn.addEventListener("pointerdown",  (e) => { e.preventDefault(); dpadStart(btn); });
  btn.addEventListener("pointerup",    (e) => { e.preventDefault(); dpadEnd(btn); });
  btn.addEventListener("pointerleave", (e) => { dpadEnd(btn); });
  btn.addEventListener("pointercancel",(e) => { dpadEnd(btn); });
});

document.getElementById("resetBtn").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  sendReset();
});

// ── 速度滑桿 ──────────────────────────────────────────────

document.getElementById("speedSlider").addEventListener("input", (e) => {
  speed = parseInt(e.target.value);
  document.getElementById("speedVal").textContent = speed;
});

// ── 搖桿 ─────────────────────────────────────────────────

const joystickZone = document.getElementById("joystickZone");
const knob         = document.getElementById("joystickKnob");
let joyActive = false, joyOriginX = 0, joyOriginY = 0, joyTimer = null;

function joystickStart(e) {
  e.preventDefault();
  joyActive = true;
  const rect = joystickZone.getBoundingClientRect();
  joyOriginX = rect.left + rect.width  / 2;
  joyOriginY = rect.top  + rect.height / 2;
  joyTimer = setInterval(joystickTick, REPEAT_INTERVAL);
}

function joystickMove(e) {
  if (!joyActive) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const cx = joystickZone.getBoundingClientRect().width  / 2;
  const cy = joystickZone.getBoundingClientRect().height / 2;
  const maxR = cx - 30;
  let dx = touch.clientX - joyOriginX;
  let dy = touch.clientY - joyOriginY;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) {
    dx = dx / dist * maxR;
    dy = dy / dist * maxR;
  }
  knob.style.left = (cx + dx) + "px";
  knob.style.top  = (cy + dy) + "px";

  // 正規化到 [-1, 1]
  knob._ndx = dx / maxR;
  knob._ndy = dy / maxR;
}

function joystickEnd(e) {
  joyActive = false;
  clearInterval(joyTimer);
  knob.style.left = "50%";
  knob.style.top  = "50%";
  knob._ndx = 0; knob._ndy = 0;
}

function joystickTick() {
  if (Math.abs(knob._ndx||0) > 0.05 || Math.abs(knob._ndy||0) > 0.05)
    sendMove(knob._ndx || 0, knob._ndy || 0);
}

joystickZone.addEventListener("pointerdown",  joystickStart);
joystickZone.addEventListener("pointermove",  joystickMove);
joystickZone.addEventListener("pointerup",    joystickEnd);
joystickZone.addEventListener("pointercancel",joystickEnd);

// ── 拖曳模式 ──────────────────────────────────────────────

const dragCanvas = document.getElementById("dragCanvas");
const dragDot    = document.getElementById("dragDot");

function updateDragDot() {
  const rect = dragCanvas.getBoundingClientRect();
  const rx = posX / canvasW;
  const ry = posY / canvasH;
  dragDot.style.left = (rx * rect.width)  + "px";
  dragDot.style.top  = (ry * rect.height) + "px";
}

dragCanvas.addEventListener("pointermove", (e) => {
  if (e.buttons === 0) return;
  e.preventDefault();
  const rect = dragCanvas.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / rect.width;
  const ry = (e.clientY - rect.top)  / rect.height;
  posX = Math.max(0, Math.min(canvasW, rx * canvasW));
  posY = Math.max(0, Math.min(canvasH, ry * canvasH));
  updateDragDot();
  sendPosition(posX, posY);
});

dragCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  dragCanvas.setPointerCapture(e.pointerId);
  const rect = dragCanvas.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / rect.width;
  const ry = (e.clientY - rect.top)  / rect.height;
  posX = rx * canvasW;
  posY = ry * canvasH;
  updateDragDot();
  sendPosition(posX, posY);
});

// ── 模式切換 ──────────────────────────────────────────────

function setMode(m) {
  mode = m;
  document.querySelectorAll(".mode-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.mode === m)
  );
  document.getElementById("dpadZone").style.display     = m === "dpad"     ? "grid"  : "none";
  document.getElementById("joystickZone").style.display = m === "joystick" ? "flex"  : "none";
  document.getElementById("dragCanvas").style.display   = m === "drag"     ? "block" : "none";
  document.getElementById("touchpad").style.display     = m === "mouse"    ? "block" : "none";
  if (m === "drag") updateDragDot();
}

// ── 滑鼠觸控板：移動 / 單擊 / 雙擊 / 雙指捲動 ─────────────────────────────────

const touchpad = document.getElementById("touchpad");
const pointers = new Map();            // pointerId → {x, y}
let tapStart   = null;                 // {x, y, t, moved}
let lastTapTime = 0;
let pendingClickTimer = null;
let scrollLastAvgY = null;
let scrollAccum = 0;

const TAP_MAX_MS   = 250;   // 點擊判定的最長時間
const TAP_MAX_MOVE = 12;    // 點擊判定的最大位移（px）
const DBL_GAP_MS   = 300;   // 雙擊間隔
const SCROLL_STEP  = 36;    // 每多少 px 觸發一格滾輪

function padToCanvas(clientX, clientY) {
  const rect = touchpad.getBoundingClientRect();
  const rx = (clientX - rect.left) / rect.width;
  const ry = (clientY - rect.top)  / rect.height;
  return {
    x: Math.max(0, Math.min(canvasW, rx * canvasW)),
    y: Math.max(0, Math.min(canvasH, ry * canvasH)),
  };
}

touchpad.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  touchpad.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    tapStart = { x: e.clientX, y: e.clientY, t: Date.now(), moved: false };
    // 立即把游標移到觸控點（絕對映射）
    const p = padToCanvas(e.clientX, e.clientY);
    posX = p.x; posY = p.y; sendPosition(posX, posY);
  } else if (pointers.size === 2) {
    // 進入雙指捲動：取消單指點擊判定
    tapStart = null;
    scrollLastAvgY = avgPointerY();
    scrollAccum = 0;
  }
});

touchpad.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  e.preventDefault();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2) {
    // 雙指：垂直位移 → 滾輪
    const avgY = avgPointerY();
    if (scrollLastAvgY !== null) {
      scrollAccum += (avgY - scrollLastAvgY);
      scrollLastAvgY = avgY;
      while (Math.abs(scrollAccum) >= SCROLL_STEP) {
        if (scrollAccum > 0) {        // 手指下滑 → 滾輪向下（負值）
          sendScroll(-1);
          scrollAccum -= SCROLL_STEP;
        } else {                      // 手指上滑 → 滾輪向上（正值）
          sendScroll(1);
          scrollAccum += SCROLL_STEP;
        }
      }
    }
    return;
  }

  // 單指：移動游標
  const p = padToCanvas(e.clientX, e.clientY);
  posX = p.x; posY = p.y; sendPosition(posX, posY);
  if (tapStart) {
    if (Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > TAP_MAX_MOVE)
      tapStart.moved = true;
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);

  if (pointers.size >= 1) {
    // 還有手指在板上（多指收尾），重置捲動基準
    scrollLastAvgY = pointers.size >= 2 ? avgPointerY() : null;
    return;
  }
  scrollLastAvgY = null;

  // 單指離開 → 判定是否為「點擊」
  if (tapStart && !tapStart.moved && (Date.now() - tapStart.t) <= TAP_MAX_MS) {
    const now = Date.now();
    if (now - lastTapTime <= DBL_GAP_MS) {
      // 雙擊
      if (pendingClickTimer) { clearTimeout(pendingClickTimer); pendingClickTimer = null; }
      lastTapTime = 0;
      sendDblClick();
    } else {
      // 單擊（延遲送出，等待是否有第二擊變成雙擊）
      lastTapTime = now;
      pendingClickTimer = setTimeout(() => { sendClick(); pendingClickTimer = null; }, DBL_GAP_MS);
    }
  }
  tapStart = null;
}

function avgPointerY() {
  let sum = 0;
  for (const p of pointers.values()) sum += p.y;
  return pointers.size ? sum / pointers.size : 0;
}

touchpad.addEventListener("pointerup",     endPointer);
touchpad.addEventListener("pointercancel", endPointer);
touchpad.addEventListener("pointerleave",  endPointer);

// ── 上傳照片（顯示在圓圈裡）──────────────────────────────────────────────────

const photoBtn   = document.getElementById("photoBtn");
const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");

photoBtn.addEventListener("click", () => photoInput.click());

photoInput.addEventListener("change", () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // 前端先壓縮成 256x256 正方形（置中裁切），降低傳輸量
      const SIZE = 256;
      const canvas = document.createElement("canvas");
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext("2d");
      const side = Math.min(img.width, img.height);
      const sx = (img.width  - side) / 2;
      const sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      uploadPhoto(dataUrl);
      photoPreview.style.backgroundImage = `url(${dataUrl})`;
      photoPreview.classList.add("show");
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = "";  // 允許再次選同一張
});

function uploadPhoto(dataUrl) {
  if (!deviceId || !token) return;
  photoBtn.textContent = "上傳中…";
  fetch("/api/image", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ device_id: deviceId, token, data: dataUrl }),
  }).then(r => {
    photoBtn.textContent = r.ok ? "✓ 已更新圓圈圖案" : "上傳失敗，再試一次";
    setTimeout(() => { photoBtn.textContent = "上傳照片（圓圈圖案）"; }, 1800);
  }).catch(() => {
    photoBtn.textContent = "上傳失敗，再試一次";
    setTimeout(() => { photoBtn.textContent = "上傳照片（圓圈圖案）"; }, 1800);
  });
}

// ── 顏色選擇器 ────────────────────────────────────────────

function updateColorSwatches() {
  const row = document.getElementById("colorRow");
  // 移除舊格（保留 label span）
  [...row.querySelectorAll(".color-swatch")].forEach(el => el.remove());
  COLORS.forEach(c => {
    const sw = document.createElement("div");
    sw.className = "color-swatch" + (c === myColor ? " active" : "");
    sw.style.background = c;
    sw.addEventListener("click", () => {
      myColor = c;
      document.getElementById("colorDot").style.background = c;
      document.getElementById("dragDot").style.background  = c;
      row.querySelectorAll(".color-swatch").forEach(s =>
        s.classList.toggle("active", s.style.background === c)
      );
    });
    row.appendChild(sw);
  });
}
updateColorSwatches();

// ── 啟動 ─────────────────────────────────────────────────

connect();
</script>
